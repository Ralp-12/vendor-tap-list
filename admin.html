<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor list — Acid Solution</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f1f3f6; color: #1c2330; padding: 16px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .header { background: #1f2a3d; color: #fff; padding: 22px; border-radius: 16px 16px 0 0; }
  .header h1 { font-size: 20px; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: .75; }
  .tools { background: #fff; padding: 16px 22px; display: flex; gap: 10px; flex-wrap: wrap;
           border-bottom: 1px solid #e2e7ef; }
  .tools input, .tools select { padding: 10px 12px; font-size: 15px;
    border: 1.5px solid #d7dce4; border-radius: 10px; background: #fafbfd; }
  .tools input { flex: 1; min-width: 180px; }
  .tools a { padding: 10px 18px; font-size: 14px; font-weight: 700; color: #fff;
    background: #1c7c3e; border-radius: 10px; text-decoration: none; }
  .tools a.alt { background: #1f2a3d; }
  table { width: 100%; background: #fff; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 12px; background: #f7f9fc; color: #66707f;
       font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td { padding: 10px 12px; border-top: 1px solid #eef1f5; vertical-align: top; }
  .group td { background: #eef2f8; font-weight: 700; font-size: 14px;
    padding: 12px; border-top: 2px solid #d7dce4; }
  .group td span { font-weight: 400; color: #66707f; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; color: #1f2a3d;
         background: #e8edf5; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
  .empty { background: #fff; padding: 40px; text-align: center; color: #66707f;
           border-radius: 0 0 16px 16px; }
  .count { padding: 12px 22px; background: #fff; font-size: 13px; color: #66707f;
           border-radius: 0 0 16px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Vendor list — Acid Solution</h1>
    <p>Everyone who checked in at the booth — search, filter by expertise, export anytime. Acid Solution is a mock-up name.</p>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search name, company, anything…">
    <select id="exp">
      <option value="">All expertise</option>
      <option>HVAC</option>
      <option>Electrical</option>
      <option>Plumbing</option>
      <option>Fire &amp; Life Safety</option>
      <option>Building Automation &amp; Controls</option>
      <option>Elevators &amp; Lifts</option>
      <option>Power &amp; Generators</option>
      <option>Water Treatment</option>
      <option>Equipment &amp; Tools</option>
      <option>Software &amp; IoT</option>
      <option>Roofing &amp; Building Envelope</option>
      <option>Janitorial &amp; Grounds</option>
      <option>Security Systems</option>
      <option>Other</option>
    </select>
    <a href="/api/export.csv" id="exportFiltered">Export list</a>
    <a href="/api/export.csv" id="exportAll" class="alt">Export all</a>
  </div>
  <div id="tableWrap"></div>
  <div class="count" id="count"></div>
</div>

<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  const q = document.getElementById("q").value;
  const exp = document.getElementById("exp").value;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (exp) params.set("expertise", exp);
  // Export filtered list follows whatever is on screen;
  // Export all always points at the plain, unfiltered export.
  const qs = params.toString();
  const filt = document.getElementById("exportFiltered");
  filt.href = "/api/export.csv" + (qs ? "?" + qs : "");
  filt.textContent = (q || exp) ? "Export filtered list" : "Export list";
  const res = await fetch("/api/vendors?" + params.toString());
  const data = await res.json();
  const wrap = document.getElementById("tableWrap");
  document.getElementById("count").textContent =
    data.count + (data.count === 1 ? " vendor" : " vendors");
  if (!data.vendors.length) {
    wrap.innerHTML = '<div class="empty">No check-ins yet — they will appear here as vendors scan your badge.</div>';
    return;
  }
  let html = "<table><tr><th>When</th><th>Name</th><th>Company</th><th>Contact</th><th>What they do</th><th>Expertise</th></tr>";
  let currentCompany = null;
  let companyCount = 0;
  const flushGroup = () => {
    if (currentCompany !== null) {
      html += '<tr class="group"><td colspan="6">' + esc(currentCompany) +
        ' <span>· ' + companyCount + (companyCount === 1 ? ' person' : ' people') + '</span></td></tr>';
    }
  };
  // rows arrive sorted by company, so same-company people sit together
  const groups = {};
  for (const v of data.vendors) groups[v.company] = (groups[v.company] || 0) + 1;
  for (const v of data.vendors) {
    if (v.company !== currentCompany) {
      currentCompany = v.company;
      companyCount = groups[v.company];
      flushGroup();
    }
    html += "<tr><td>" + esc(v.timestamp) + "</td><td><b>" + esc(v.name) +
      "</b></td><td>" + esc(v.company) + "</td><td>" + esc(v.contact) +
      "</td><td>" + esc(v.what) + '</td><td><span class="tag">' +
      esc(v.expertise) + "</span></td></tr>";
  }
  wrap.innerHTML = html + "</table>";
}
document.getElementById("q").addEventListener("input", load);
document.getElementById("exp").addEventListener("change", load);
load();
</script>
</body>
</html>
